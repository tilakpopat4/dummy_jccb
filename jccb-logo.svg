<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- Top Arc Text Path for Bank Name -->
        <path id="topBankArc" d="M 52,250 A 198,198 0 1,1 448,250" fill="none" />
        <!-- Bottom Arc Text Path for Junagadh -->
        <path id="bottomBankArc" d="M 88,250 A 162,162 0 0,0 412,250" fill="none" />
        <style>
            .bank-blue { fill: #0012b3; }
            .bank-stroke { stroke: #0012b3; stroke-linejoin: round; stroke-linecap: round; }
            .bank-text { font-family: 'Arial', 'Segoe UI', sans-serif; font-weight: 900; fill: #0012b3; }
        </style>
    </defs>

    <!-- 1. Pure White Circular Base Disc -->
    <circle cx="250" cy="250" r="248" fill="#ffffff" />

    <!-- 2. Outermost Thick Blue Ring -->
    <circle cx="250" cy="250" r="241" fill="none" class="bank-stroke" stroke-width="8.5" />
    
    <!-- 3. Concentric Secondary Thin Ring -->
    <circle cx="250" cy="250" r="229" fill="none" class="bank-stroke" stroke-width="2.5" />

    <!-- 4. Circular Bank Name Text (Top Arc) -->
    <text class="bank-text" font-size="24.5" letter-spacing="1.5px">
        <textPath href="#topBankArc" xlink:href="#topBankArc" startOffset="50%" text-anchor="middle">
            THE JUNAGADH COMMERCIAL CO-OPERATIVE BANK LTD.
        </textPath>
    </text>

    <!-- 5. Circular City Name & Bullets (Bottom Arc) -->
    <text class="bank-text" font-size="27.5" letter-spacing="3.5px">
        <textPath href="#bottomBankArc" xlink:href="#bottomBankArc" startOffset="50%" text-anchor="middle">
            &#8226; JUNAGADH. &#8226;
        </textPath>
    </text>

    <!-- 6. Inner Double Rings enclosing center emblem -->
    <circle cx="250" cy="250" r="147" fill="none" class="bank-stroke" stroke-width="7" />
    <circle cx="250" cy="250" r="139" fill="none" class="bank-stroke" stroke-width="2" />

    <!-- 7. Center Emblem: Industrial Cogwheel / Gear + Balance Scales -->
    <g transform="translate(250, 250)">
        <!-- 8 Gear Teeth / Cogs -->
        <rect x="-14" y="-136" width="28" height="26" class="bank-blue" rx="1.5" />
        <rect x="-14" y="110" width="28" height="26" class="bank-blue" rx="1.5" />
        <rect x="-136" y="-14" width="26" height="28" class="bank-blue" rx="1.5" />
        <rect x="110" y="-14" width="26" height="28" class="bank-blue" rx="1.5" />
        
        <!-- Diagonal Cogs (45 deg rotated) -->
        <rect x="-14" y="-136" width="28" height="26" class="bank-blue" rx="1.5" transform="rotate(45)" />
        <rect x="-14" y="110" width="28" height="26" class="bank-blue" rx="1.5" transform="rotate(45)" />
        <rect x="-136" y="-14" width="26" height="28" class="bank-blue" rx="1.5" transform="rotate(45)" />
        <rect x="110" y="-14" width="26" height="28" class="bank-blue" rx="1.5" transform="rotate(45)" />

        <!-- Gear Rim Ring -->
        <circle cx="0" cy="0" r="106" fill="none" class="bank-stroke" stroke-width="15.5" />

        <!-- Vertical Post (Top & Bottom) -->
        <rect x="-5" y="-106" width="10" height="56" class="bank-blue" />
        <rect x="-5" y="56" width="10" height="50" class="bank-blue" />

        <!-- Horizontal Balance Beam with Double Bars -->
        <rect x="-92" y="-49" width="184" height="6.5" class="bank-blue" />
        <rect x="-92" y="-33" width="184" height="6.5" class="bank-blue" />

        <!-- Left Scale Pan & Cords (Triangles) -->
        <!-- Left Cords -->
        <polygon points="-49,-33 -86,18 -12,18" fill="none" class="bank-stroke" stroke-width="4.5" />
        <line x1="-49" y1="-33" x2="-49" y2="18" class="bank-stroke" stroke-width="4" />
        <!-- Left Pan Base -->
        <polygon points="-90,18 -8,18 -14,29 -84,29" fill="none" class="bank-stroke" stroke-width="4" />

        <!-- Right Scale Pan & Cords (Triangles) -->
        <!-- Right Cords -->
        <polygon points="49,-33 12,18 86,18" fill="none" class="bank-stroke" stroke-width="4.5" />
        <line x1="49" y1="-33" x2="49" y2="18" class="bank-stroke" stroke-width="4" />
        <!-- Right Pan Base -->
        <polygon points="8,18 90,18 84,29 14,29" fill="none" class="bank-stroke" stroke-width="4" />

        <!-- Central Gujarati "શ્રી" Inscription -->
        <text x="0" y="6" text-anchor="middle" font-family="'Noto Sans Gujarati', 'Shruti', 'Gujarati MT', 'Arial Unicode MS', Arial, sans-serif" font-size="34" font-weight="900" class="bank-blue">
            શ્રી
        </text>
    </g>
</svg>
